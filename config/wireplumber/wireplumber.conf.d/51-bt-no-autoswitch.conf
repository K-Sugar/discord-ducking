# OPTIONAL - not installed by default. Enable with:
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp 51-bt-no-autoswitch.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
#
# Stops WirePlumber flipping Bluetooth devices into headset (HSP/HFP) mode
# whenever ANY application opens a capture stream -- it does this even when the
# app records from a completely different microphone. The cost is mono, ~24 kHz
# playback for the whole call.
#
# TRADE-OFF: with this disabled, your Bluetooth microphone is no longer selected
# automatically. Switch to it deliberately when you want it:
#     discord-ducking bt-mic on     # headset mode, mic available
#     discord-ducking bt-mic off    # back to A2DP, good playback
#
# Revert by deleting this file and restarting wireplumber.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
