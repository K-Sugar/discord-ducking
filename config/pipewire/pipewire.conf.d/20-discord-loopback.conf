# Discord ducking - loopback DiscordSink -> current default sink.
# See the discord-ducking repo, docs/DESIGN.md §4.2
# DELIBERATE: no target.object on playback.props (§3.1 follow-the-default)
# DELIBERATE: no node.dont-reconnect (§3.2 survives Bluetooth dropouts)
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Discord Direct Out"
      capture.props = {
        node.name           = "discord_direct_capture"
        target.object       = "DiscordSink"
        stream.capture.sink = true
        node.passive        = true
      }
      playback.props = {
        node.name        = "discord_direct_playback"
        application.name = "DiscordDirectOut"
        media.class      = "Stream/Output/Audio"
      }
    }
  }
]
